name: Build Mott Studio for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install "pyinstaller>=6,<7"

      - name: Build Mott Studio
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "Mott Studio" mott_studio.py

      - name: Upload Windows program
        uses: actions/upload-artifact@v4
        with:
          name: Mott-Studio-Windows
          path: dist/Mott Studio/
          if-no-files-found: error
